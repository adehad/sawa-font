name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Workflow-level cancellation would also kill a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --group build --group report
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run --group build --group report pytest
      - run: uv run sawa check i18n

  site:
    name: Site checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # Full history and tags, so the report can find the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: font-downloads-${{ hashFiles('data/upstream.json') }}
      # The Sawa families take minutes to build; the stamps in fonts/ let a
      # restored cache skip them, and the anchored and compacted masters in
      # .cache/masters let a rebuild skip the stages whose inputs are unchanged.
      - uses: actions/cache@v6
        with:
          path: |
            fonts
            .cache/masters
          key: sawa-fonts-${{ hashFiles('data/upstream.json', 'data/sawa.json', 'data/mark-groups.json', 'data/tanzil/**', 'tests/strings/**', 'uv.lock', 'src/sawa_tools/build/**', 'src/sawa_tools/report/bidi.py', 'src/sawa_tools/corpus.py', 'src/sawa_tools/tanzil.py', 'src/sawa_tools/checks/attachment.py', 'src/sawa_tools/checks/marks.py') }}
          restore-keys: sawa-fonts-
      - name: Build Sawa and fetch roster fonts
        working-directory: .
        run: uv run --locked --group build sawa build fonts
      - name: Check the Sawa families
        working-directory: .
        run: uv run --locked --group build sawa check fonts
      - name: Fetch the previous release's report
        id: baseline
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --locked sawa report baseline --tag "$TAG" --out report/baseline
      - name: Build the report bundle
        working-directory: .
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          BASELINE: ${{ steps.baseline.outputs.dir }}
          # Fontbakery adds a few minutes; pull requests skip it.
          FONTBAKERY: ${{ github.event_name != 'pull_request' }}
        run: |
          args=(--version "$VERSION" --out report/current)
          if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
          if [ "$FONTBAKERY" = true ]; then args+=(--fontbakery); fi
          uv run --locked --group build --group report sawa report build "${args[@]}"
      - name: Upload the report bundle
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: report/current
          retention-days: 30
      - name: Check mark-group coverage
        working-directory: .
        run: uv run --locked --group build sawa check marks
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:ts
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      - run: bun run lint:css
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
      # --with-deps apt-installs system libraries, which the cache can't hold.
      - run: bunx playwright install --with-deps chromium
      # Builds the site against the report bundle generated above.
      - run: bun run test:e2e
        env:
          REPORT_DIR: ../report/current
      - run: bun run test:e2e:report-only
        env:
          REPORT_DIR: ../report/current
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
      - name: Build for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPORT_DIR: ../report/current
        run: bun run build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  release:
    name: Attach the report to the release
    if: github.ref_type == 'tag'
    needs: [python, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: report
          path: report
      - name: Zip the report bundle
        working-directory: report
        run: zip -qr "../sawa-report-${GITHUB_REF_NAME}.zip" .
      # Read the Docs fetches each release's bundle from this asset (§8.3).
      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" "sawa-report-${GITHUB_REF_NAME}.zip" --clobber

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
