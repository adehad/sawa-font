[project]
name = "sawa-tools"
version = "0.1.0"
description = "Build, test and report tooling for the Sawa font family and its specimen site"
authors = [
    { name = "adehad", email = "26027314+adehad@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sawa = "sawa_tools.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]
build = [
    "fonttools[woff]",
    "uharfbuzz>=0.56.2",
]
report = [
    "fontbakery>=1.1.0",
    "glyphsets>=1.1.3",
    "numpy>=2.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",
    "PTH",     # pathlib over os.path, keeps paths portable on Windows
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ty.environment]
python = "./.venv"
