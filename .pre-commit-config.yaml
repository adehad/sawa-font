repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        files: \.py$
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        files: \.py$
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        files: \.py$
        pass_filenames: false
      - id: sawa-check-i18n
        name: sawa check i18n
        entry: uv run sawa check i18n
        language: system
        files: ^site/src/i18n/
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: bun run --cwd site lint
        language: system
        files: ^site/
        pass_filenames: false
      - id: oxfmt-check
        name: oxfmt --check
        entry: bun run --cwd site fmt:check
        language: system
        files: ^site/
        pass_filenames: false
      - id: stylelint
        name: stylelint
        entry: bun run --cwd site lint:css
        language: system
        files: ^site/
        pass_filenames: false
      - id: lab-oxlint
        name: oxlint (lab)
        entry: bun run --cwd lab lint
        language: system
        files: ^lab/
        pass_filenames: false
      - id: lab-oxfmt-check
        name: oxfmt --check (lab)
        entry: bun run --cwd lab fmt:check
        language: system
        files: ^lab/
        pass_filenames: false
